name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, name: "minecx-windows-amd64.exe",     ldflags: "-s -w" }
          - { goos: windows, goarch: amd64, name: "minecx-windows-amd64-gui.exe", ldflags: "-s -w -H=windowsgui" }
          - { goos: linux,   goarch: amd64, name: "minecx-linux-amd64",           ldflags: "-s -w" }
          - { goos: linux,   goarch: arm64, name: "minecx-linux-arm64",           ldflags: "-s -w" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "${{ matrix.ldflags }}" -o "dist/${{ matrix.name }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum minecx-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
